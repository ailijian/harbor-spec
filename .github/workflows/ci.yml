name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test-audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.9", "3.10", "3.11" ]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install package and tools
        run: |
          python -m pip install -e ".[dev]"

      - name: Harbor verify-generated (CI gate)
        env:
          HARBOR_LANGUAGE: zh
          HARBOR_LANG: zh
        run: harbor verify-generated --all --ci --format json

      - name: Run unit tests
        env:
          HARBOR_LANGUAGE: zh
          HARBOR_LANG: zh
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: pytest

      - name: Harbor checkpoint (CI gate)
        env:
          HARBOR_LANGUAGE: zh
          HARBOR_LANG: zh
        run: harbor checkpoint --ci --format json

      - name: Harbor stale (CI gate)
        env:
          HARBOR_LANGUAGE: zh
          HARBOR_LANG: zh
        run: harbor stale --ci --format json

      - name: Harbor doctor (CI gate)
        env:
          HARBOR_LANGUAGE: zh
          HARBOR_LANG: zh
        run: harbor doctor --ci --format json

  windows-full-governance:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install package and tools
        run: |
          python -m pip install -e ".[dev]"

      - name: Harbor verify-generated (CI gate)
        env:
          HARBOR_LANGUAGE: zh
          HARBOR_LANG: zh
        run: harbor verify-generated --all --ci --format json

      - name: Run unit tests
        env:
          HARBOR_LANGUAGE: zh
          HARBOR_LANG: zh
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: pytest

      - name: Harbor checkpoint (CI gate)
        env:
          HARBOR_LANGUAGE: zh
          HARBOR_LANG: zh
        run: harbor checkpoint --ci --format json

      - name: Harbor stale (CI gate)
        env:
          HARBOR_LANGUAGE: zh
          HARBOR_LANG: zh
        run: harbor stale --ci --format json

      - name: Harbor doctor (CI gate)
        env:
          HARBOR_LANGUAGE: zh
          HARBOR_LANG: zh
        run: harbor doctor --ci --format json
