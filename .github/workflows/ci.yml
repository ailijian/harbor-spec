name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test-audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.9", "3.10", "3.11" ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install package and tools
        run: |
          python -m pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest

      - name: Harbor build-index
        run: harbor build-index

      - name: Harbor status should be clean
        run: |
          out="$(harbor status)"
          echo "$out"
          if [ "$out" != "No changes detected." ]; then
            echo "Harbor status not clean"
            exit 1
          fi

      - name: Harbor DDT validate
        run: harbor ddt validate

      - name: Harbor semantic audit (non-blocking)
        run: harbor audit --semantic
        continue-on-error: true
