name: Release and Publish to PyPI

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-publish:
    name: Build and publish
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build distributions
        run: python -m build

      - name: Check metadata
        run: python -m twine check dist/*

      - name: Verify tag matches version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          echo "github.ref=${{ github.ref }}"
          echo "GITHUB_REF=${GITHUB_REF}"
          TAG="${GITHUB_REF#refs/tags/}"
          PKG_VER="$(python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'])")"
          echo "Tag=${TAG}"
          echo "PackageVersion=${PKG_VER}"
          if [ "${TAG}" != "v${PKG_VER}" ] && [ "${TAG}" != "${PKG_VER}" ]; then
            echo "Version mismatch between tag and pyproject.toml" >&2
            exit 1
          fi

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
          verbose: true
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
