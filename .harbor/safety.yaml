runtime:
  default_shell: powershell
  default_network: ask

protected_paths:
  deny_write:
    - ".env"
    - ".env.*"
    - "secrets/**"
    - "prod/**"
  ask_write:
    - ".github/workflows/**"
    - "migrations/**"
    - "alembic/versions/**"
    - "Dockerfile"
    - "docker-compose*.yml"
    - "pyproject.toml"
    - "package.json"

dangerous_commands:
  deny:
    - "rm -rf"
    - "del /s"
    - "rmdir /s"
    - "git reset --hard"
    - "drop database"
    - "truncate table"
  ask:
    - "pip install"
    - "npm install"
    - "git push"
    - "alembic upgrade"
    - "docker compose down"