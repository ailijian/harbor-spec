schema_version: "1.0.2"
project:
  name: "harbor-spec"
  language: "python"
  profile: "enforce_l3"
code_roots:
  - "harbor/**"
test_roots:
  - "tests"
l3:
  enabled: true
  enabled_paths:
    - "harbor/**"
  exclude_paths:
    - "legacy/**"
  strictness_defaults:
    public: "strict"
    internal: "standard"
  overrides: []
l2:
  enabled: true
  auto_regen: true
diary:
  enabled: true
  dir: "specs/diary"
  min_importance_to_auto_log: "normal"
  default_visibility: "internal"
ddt:
  minimal_required_for_public: true
  treat_missing_as_error_in_strict_profile: true
  forbid_latest_for_strict: true
sync:
  mode: "relaxed"
health:
  thresholds:
    min_public_ddt_coverage: 0.8
    max_context_debt: 10

