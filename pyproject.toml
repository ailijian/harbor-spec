[project]
name = "harbor-spec"
version = "1.3.0b6"
description = "Harbor-spec: context governance engine for AI coding, with contract drift detection, DDT validation, workflow facades, L2 README generation, module capsules, and advisory health checks."
readme = "README.md"
requires-python = ">=3.9"
keywords = ["ai-coding", "context-governance", "cli", "docstring", "ddt"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Documentation",
]
dependencies = [
  "pyyaml",
  "pathspec>=0.12.1",
  "rich>=13.0.0",
  "prompt_toolkit>=3.0,<4",
  "openai>=1.0.0",
  "python-dotenv>=1.0.0",
]

[project.scripts]
harbor = "harbor.cli.main:main"

[project.optional-dependencies]
dev = [
  "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["harbor*"]

[tool.setuptools.package-data]
"harbor.templates.init" = ["files/**/*"]
